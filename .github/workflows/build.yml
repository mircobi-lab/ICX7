# Compila MBStudio91 ICX7 su GitHub a ogni aggiornamento del ramo main:
#  - Mac: VST3 + AU + app, binario universale (Apple Silicon e Intel), firma ad hoc, controllo con pluginval
#  - Windows: VST3 + app (x64), controllo con pluginval
# Il motore FM (Rust, engine/) viene compilato automaticamente da CMake.
# I file pronti vengono pubblicati nella pagina "Releases" del repository: non serve scaricare i sorgenti.
name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-test:
    name: Test del motore (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        working-directory: engine
        run: cargo test --release --locked -p icx7-ffi

  mac:
    name: macOS universale
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust per Apple Silicon e Intel
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Configura
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compila
        run: cmake --build build --config Release --target MBStudio91ICX7_VST3 MBStudio91ICX7_AU MBStudio91ICX7_Standalone -- -quiet
      - name: Controlla che sia universale
        run: lipo -info "build/MBStudio91ICX7_artefacts/Release/VST3/MBStudio91 ICX7.vst3/Contents/MacOS/MBStudio91 ICX7"
      - name: Firma ad hoc e comprimi
        run: |
          cd "build/MBStudio91ICX7_artefacts/Release"
          codesign --force --deep -s - "VST3/MBStudio91 ICX7.vst3"
          codesign --force --deep -s - "AU/MBStudio91 ICX7.component"
          codesign --force --deep -s - "Standalone/MBStudio91 ICX7.app"
          ditto -c -k --keepParent "VST3/MBStudio91 ICX7.vst3"      "ICX7-VST3-mac.zip"
          ditto -c -k --keepParent "AU/MBStudio91 ICX7.component"   "ICX7-AU-mac.zip"
          ditto -c -k --keepParent "Standalone/MBStudio91 ICX7.app" "ICX7-App-mac.zip"
      - name: Controllo con pluginval
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests "build/MBStudio91ICX7_artefacts/Release/VST3/MBStudio91 ICX7.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/MBStudio91ICX7_artefacts/Release/*.zip

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -A x64
      - name: Compila
        run: cmake --build build --config Release --target MBStudio91ICX7_VST3 MBStudio91ICX7_Standalone
      - name: Controllo con pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pv.zip
          Expand-Archive pv.zip -DestinationPath pv
          ./pv/pluginval.exe --strictness-level 10 --validate-in-process --skip-gui-tests "build/MBStudio91ICX7_artefacts/Release/VST3/MBStudio91 ICX7.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Comprimi
        shell: pwsh
        run: |
          $r = "build/MBStudio91ICX7_artefacts/Release"
          Compress-Archive -Path "$r/VST3/MBStudio91 ICX7.vst3" -DestinationPath "ICX7-VST3-win.zip"
          Compress-Archive -Path "$r/Standalone/MBStudio91 ICX7.exe" -DestinationPath "ICX7-App-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    name: Pubblica in Releases
    if: github.ref == 'refs/heads/main'
    needs: [engine-test, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: MBStudio91 ICX7 0.1.${{ github.run_number }}
          body: |
            Compilato automaticamente da GitHub dal commit ${{ github.sha }}.

            **Mac** (Apple Silicon e Intel, macOS 11 o successivo)
            - ICX7-VST3-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/VST3/
            - ICX7-AU-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/Components/
            - ICX7-App-mac.zip: versione autonoma, va in Applicazioni
            Il plugin non è firmato da Apple: dopo averlo copiato, nel Terminale
            `xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"MBStudio91 ICX7.vst3" ~/Library/Audio/Plug-Ins/Components/"MBStudio91 ICX7.component" /Applications/"MBStudio91 ICX7.app"`

            **Windows** (64 bit)
            - ICX7-VST3-win.zip: estrai e copia la cartella "MBStudio91 ICX7.vst3" in C:\Program Files\Common Files\VST3\
            - ICX7-App-win.zip: versione autonoma (MBStudio91 ICX7.exe)
          files: dist/*.zip
